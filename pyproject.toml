[project]
name = "footerpilot"
version = "0.1.0"
description = "Company-wide email signature manager for Google Workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "authlib>=1.9.9",
    "boto3>=1.44.6",
    "fastapi>=0.165.0",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "httpx2>=2.16.2",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "procrastinate>=3.12.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is the intended usage
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
