{# Swapped out-of-band, so errors update without touching the last good preview. #}
<div id="generator-errors" hx-swap-oob="true">
  {% if errors %}
  <ul class="mt-4 space-y-1 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert">
    {% for error in errors %}
    <li>{{ error }}</li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
