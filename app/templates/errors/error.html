{% extends "base.html" %}

{% block title %}{{ title }} | FooterPilot{% endblock %}

{% block meta %}<meta name="robots" content="noindex">{% endblock %}

{% block content %}
<section class="mx-auto max-w-6xl px-4 py-24 sm:px-6">
  <p class="text-sm font-semibold text-brand-600">Error {{ status_code }}</p>
  <h1 class="mt-2 text-3xl font-bold tracking-tight">{{ title }}</h1>
  <p class="mt-4 text-slate-600">{{ message }}</p>
  <a href="/" class="mt-8 inline-block rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-700">
    Back to home
  </a>
</section>
{% endblock %}
