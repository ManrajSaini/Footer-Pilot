<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FooterPilot{% endblock %}</title>
  {% block meta %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="{{ url_for('static', path='vendor/htmx-2.0.11.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='vendor/alpine-3.17.5.min.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="flex min-h-full flex-col bg-slate-50 text-slate-900 antialiased" {% block body_attrs %}{% endblock %}>
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6">
      <a href="/" class="flex items-center gap-2 text-lg font-semibold tracking-tight">
        <span class="inline-flex size-8 items-center justify-center rounded-lg bg-brand-600 text-sm font-bold text-white">FP</span>
        FooterPilot
      </a>
      <nav class="flex items-center gap-6 text-sm font-medium text-slate-600">
        {% block nav %}{% endblock %}
      </nav>
    </div>
  </header>

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto max-w-6xl px-4 py-6 text-sm text-slate-500 sm:px-6">
      &copy; FooterPilot. We never read your emails.
    </div>
  </footer>
</body>
</html>
