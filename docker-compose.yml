# Local development services. The app itself runs on the host (see README).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: footerpilot
      POSTGRES_PASSWORD: footerpilot
      POSTGRES_DB: footerpilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the data volume is first created.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footerpilot -d footerpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
